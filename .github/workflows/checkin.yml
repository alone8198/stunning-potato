name: New API 自动签到

on:
  # 每天定时触发（UTC 时间，北京时间 = UTC+8）
  # 此处设置为每天 22:00 UTC = 次日 06:00 北京时间（早八点签到）
  # 如需修改时间，调整 cron 表达式即可
  schedule:
    - cron: '0 22 * * *'   # 北京时间 06:00
    # - cron: '0 14 * * *'  # 北京时间 22:00（可选，取消注释并注释上一行）

  # 允许手动触发
  workflow_dispatch:

  # Push 到 main 分支时也触发（用于测试）
  # push:
  #   branches: [ main ]

jobs:
  checkin:
    runs-on: ubuntu-latest

    # 最大运行时间 10 分钟
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 安装 Playwright Chromium 浏览器
        run: |
          playwright install --with-deps chromium

      - name: 🎯 执行签到脚本
        id: checkin
        env:
          NEWAPI_URL: ${{ secrets.NEWAPI_URL }}
          NEWAPI_COOKIE: ${{ secrets.NEWAPI_COOKIE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python checkin.py

      - name: 📸 上传截图（无论成功失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-screenshots
          path: screenshots/
          retention-days: 7

      - name: 📊 输出签到结果
        if: always()
        run: |
          echo "签到结果：${{ steps.checkin.outputs.checkin_result || '未知' }}"
