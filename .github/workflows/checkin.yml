name: New API 批量自动签到

on:
  schedule:
    - cron: '0 22 * * *'
    # - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          tesseract --version

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 执行签到
        id: checkin
        env:
          NEWAPI_URLS:       ${{ secrets.NEWAPI_URLS }}
          NEWAPI_USERNAMES:  ${{ secrets.NEWAPI_USERNAMES }}
          NEWAPI_PASSWORDS:  ${{ secrets.NEWAPI_PASSWORDS }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python checkin.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-screenshots
          path: screenshots/
          retention-days: 7

      - name: 输出结果
        if: always()
        run: |
          echo "签到结果：${{ steps.checkin.outputs.checkin_result || '未知' }}"
